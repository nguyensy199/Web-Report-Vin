/**
 * Sao chép text báo cáo chi tiết vào bộ nhớ tạm
 */
function copyReportText() {
  if (!currentReportData) return;

  // Trường hợp Báo Cáo Ngày (format 9 cột chuyên biệt)
  if (currentReportPeriodMode === 'DAY') {
    var textDay = '📋 ' + currentReportData.title + '\n'
      + '===================================\n';
    var dRankings = currentReportData.rankings || [];
    for (var di = 0; di < dRankings.length; di++) {
      var dh = dRankings[di];
      var rkStt = dh.stt || (di + 1);
      var wSt = dh.workStatus || (dh.attendance === 'Có mặt' ? 'Đi làm' : (dh.attendance || 'Đi làm'));
      var jSt = dh.jobStatus || (dh.rework > 0 ? 'Đang rework' : 'Complete');
      var rwkStr = (dh.rework !== undefined && dh.rework !== '') ? (' | Rework: ' + dh.rework) : '';
      var taskStr = dh.taskDetail ? (' | NV: ' + dh.taskDetail) : '';
      var idStr = dh.fixedIds ? (' | Đã sửa: ' + dh.fixedIds + ' ID') : '';
      var qcStr = dh.qcEvaluation ? (' | QC: ' + dh.qcEvaluation) : '';
      textDay += rkStt + '. ' + dh.memberName + ' (' + (dh.role || 'Annotator') + ') - ' + wSt + ' - [' + jSt + ']' + rwkStr + taskStr + idStr + qcStr + '\n';
    }
    navigator.clipboard.writeText(textDay).then(function() {
      showToast('Đã sao chép nội dung báo cáo ngày vào bộ nhớ tạm!', 'success');
    });
    return;
  }

  var totalRework = currentReportData.overview.totalRework !== undefined 
    ? currentReportData.overview.totalRework 
    : (currentReportData.overview.totalErrorCount || 0);

  var text = '📊 ' + currentReportData.title + '\n'
    + '===================================\n'
    + '• Tổng sản lượng: ' + currentReportData.overview.totalOutput.toLocaleString('vi-VN') + ' Cuboid\n'
    + '• Tỷ lệ đạt target: ' + currentReportData.overview.targetCompletionRate + '%\n'
    + '• Độ chính xác (Accuracy): ' + currentReportData.overview.accuracyRate + '%\n'
    + '• Tổng Rework ghi nhận: ' + totalRework + ' ca\n\n'
    + '👥 CHI TIẾT SẢN LƯỢNG THÀNH VIÊN:\n';

  var rankings = currentReportData.rankings || [];
  for (var i = 0; i < rankings.length; i++) {
    var h = rankings[i];
    var rVal = (h.rework !== undefined) ? h.rework : (h.errorCount || 0);
    var attStr = h.attendance ? (' - Chuyên cần: ' + h.attendance) : '';
    text += h.rank + '. ' + h.memberName + ' (' + (h.role || 'Annotator') + ')' + attStr + ': ' 
      + h.output.toLocaleString('vi-VN') + ' Cuboid / ' + h.target.toLocaleString('vi-VN') + ' Target (' 
      + h.targetCompletionRate + '%) - Rework: ' + rVal + '\n';
  }

  // Thêm Top nguyên nhân Rework / Lỗi (Pareto 80/20)
  var topErrList = currentReportData.topErrors || [];
  if (topErrList.length > 0) {
    text += '\n🎯 PHÂN TÍCH NGUYÊN NHÂN LỖI / REWORK HÀNG ĐẦU (PARETO 80/20):\n';
    for (var te = 0; te < topErrList.length; te++) {
      var item = topErrList[te];
      text += (te + 1) + '. ' + item.category + ': ' + item.count + ' ca (' + item.percentage + ' tổng lỗi) - Hay gặp: ' + item.topMember + '\n'
        + '   👉 Lưu ý: ' + item.guideline + '\n';
    }
  }

  // Thêm đề xuất hành động
  var recs = currentReportData.recommendations || [];
  if (recs.length > 0) {
    text += '\n💡 ĐỀ XUẤT HÀNH ĐỘNG / GHI CHÚ:\n';
    for (var r = 0; r < recs.length; r++) {
      text += '• ' + recs[r].text + '\n';
    }
  }

  navigator.clipboard.writeText(text).then(function() {
    showToast('Đã sao chép nội dung báo cáo chi tiết vào bộ nhớ tạm!', 'success');
  });
}

function renderAttendanceTable(data) {
  var tbody = document.getElementById('attendanceTableBody');
  var badgeEl = document.getElementById('attSaveStatusBadge');
  if (badgeEl) {
    badgeEl.style.display = data.isSaved ? 'inline-block' : 'none';
    badgeEl.innerText = data.isSaved ? '✓ Đã lưu ngày này' : 'Chưa lưu';
  }

  if (!tbody) return;

  var statusOptions = ['Có mặt', 'Đi muộn', 'Nghỉ phép', 'Nghỉ nửa ngày', 'Nghỉ không phép', 'Vắng mặt'];
  var demeanorOptions = ['Đạt', 'Không đạt'];

  var html = '';
  for (var i = 0; i < data.attendance.length; i++) {
    var r = data.attendance[i];

    // Select Điểm danh
    var optStatusHtml = '';
    for (var s = 0; s < statusOptions.length; s++) {
      var st = statusOptions[s];
      var selSt = (r.status === st) ? 'selected' : '';
      optStatusHtml += '<option value="' + st + '" ' + selSt + '>' + st + '</option>';
    }

    // Select Tác phong
    var optDemHtml = '';
    for (var d = 0; d < demeanorOptions.length; d++) {
      var dem = demeanorOptions[d];
      var selDem = (r.demeanor === dem) ? 'selected' : '';
      optDemHtml += '<option value="' + dem + '" ' + selDem + '>' + dem + '</option>';
    }

    // Màu role
    var roleBadge = '<span class="badge" style="background:rgba(59,130,246,0.15);color:var(--primary);font-size:11px;">' + r.role + '</span>';
    if (r.role === 'Team Lead') {
      roleBadge = '<span class="badge badge-gold" style="font-size:11px;">👑 Team Lead</span>';
    } else if (r.role === 'Annotator + QC') {
      roleBadge = '<span class="badge" style="background:rgba(16,185,129,0.15);color:var(--success);font-size:11px;">🔍 Annotator + QC</span>';
    }

    html += '<tr>'
      + '<td style="text-align:center;font-weight:700;">' + (i + 1) + '</td>'
      + '<td><strong>' + r.memberName + '</strong></td>'
      + '<td>' + roleBadge + '</td>'
      + '<td>'
      +   '<select class="form-select form-select-sm att-status-select" data-id="' + r.memberId + '" onchange="recalcAttendanceStats()">'
      +     optStatusHtml
      +   '</select>'
      + '</td>'
      + '<td>'
      +   '<select class="form-select form-select-sm att-dem-select" data-id="' + r.memberId + '" onchange="recalcAttendanceStats()">'
      +     optDemHtml
      +   '</select>'
      + '</td>'
      + '<td>'
      +   '<input type="text" class="form-input form-input-sm att-note-input" data-id="' + r.memberId + '" value="' + (r.note || '') + '" placeholder="Ghi chú lý do nghỉ, tác phong..." style="width:100%;">'
      + '</td>'
      + '</tr>';
  }

  tbody.innerHTML = html;
  recalcAttendanceStats();
}

function recalcAttendanceStats() {
  var statusSelects = document.querySelectorAll('.att-status-select');
  var demSelects = document.querySelectorAll('.att-dem-select');

  var presentCount = 0;
  var lateCount = 0;
  var leaveCount = 0;
  var absentCount = 0;
  var demFailCount = 0;
  var total = statusSelects.length;

  statusSelects.forEach(function(sel) {
    var v = sel.value;
    if (v === 'Có mặt') presentCount++;
    else if (v === 'Đi muộn') lateCount++;
    else if (v === 'Nghỉ phép' || v === 'Nghỉ nửa ngày') leaveCount++;
    else if (v === 'Vắng mặt' || v === 'Nghỉ không phép') absentCount++;
  });

  demSelects.forEach(function(sel) {
    if (sel.value === 'Không đạt') demFailCount++;
  });

  var elP = document.getElementById('attStatPresent');
  var elLate = document.getElementById('attStatLate');
  var elL = document.getElementById('attStatLeave');
  var elA = document.getElementById('attStatAbsent');
  var elD = document.getElementById('attStatDemeanorFail');

  if (elP) elP.innerText = presentCount + ' / ' + total;
  if (elLate) elLate.innerText = lateCount;
  if (elL) elL.innerText = leaveCount;
  if (elA) elA.innerText = absentCount;
  if (elD) elD.innerText = demFailCount;
}

function quickMarkAllAttendance() {
  var statusSelects = document.querySelectorAll('.att-status-select');
  var demSelects = document.querySelectorAll('.att-dem-select');
  var noteInputs = document.querySelectorAll('.att-note-input');

  statusSelects.forEach(function(sel) { sel.value = 'Có mặt'; });
  demSelects.forEach(function(sel) { sel.value = 'Đạt'; });

}

/**
 * Phân loại nhanh điểm số ở Client theo thang 1-100:
 * 90-100: L3 | 80-89: L2 | 70-79: L2 | 50-69: L1 | <50: <L1
 */
function getClientEvalClassObj(score) {
  var s = Math.round(Number(score) || 0);
  if (s >= 90) {
    return { level: 'L3', badgeClass: 'badge-l3', fillClass: 'fill-l3', borderClass: 'card-border-l3' };
  } else if (s >= 80) {
    return { level: 'L2', badgeClass: 'badge-l2', fillClass: 'fill-l2', borderClass: 'card-border-l2' };
  } else if (s >= 70) {
    return { level: 'L2', badgeClass: 'badge-l2', fillClass: 'fill-l2', borderClass: 'card-border-l2' };
  } else if (s >= 50) {
    return { level: 'L1', badgeClass: 'badge-l1', fillClass: 'fill-l1', borderClass: 'card-border-l1' };
  } else {
    return { level: '< L1', badgeClass: 'badge-below', fillClass: 'fill-below', borderClass: 'card-border-below' };
  }
}

/**

function onReasonTextChange(cat, memberId, text) {
  if (currentAttitudeData && currentAttitudeData[cat] && currentAttitudeData[cat].members) {
    var m = currentAttitudeData[cat].members.find(function(x) { return x.memberId === memberId; });
    if (m) {
      m.reason = text;
      m.isCustom = true;
    }
  }
  markAttitudeChanged();
}

/**
 * Xử lý khi sửa điểm ô input số (1-100)
 */
function onEvalScoreInputChange(cat, memberId, val) {
  var num = parseInt(val, 10);
  if (isNaN(num)) num = 75;
  if (num < 1) num = 1;
  if (num > 100) num = 100;

  var clsObj = getClientEvalClassObj(num);

  // Cập nhật thanh bar
  var bar = document.getElementById('evalBar_' + memberId);
  if (bar) {
    bar.style.width = num + '%';
    bar.className = 'attitude-bar-fill ' + clsObj.fillClass;
  }

  // Cập nhật badge trên bảng
  var badge = document.getElementById('evalBadge_' + memberId);
  if (badge) {
    badge.className = 'attitude-badge ' + clsObj.badgeClass;
    badge.innerText = clsObj.level;
  }

  // Cập nhật badge trên card
  var cBadge = document.getElementById('evalCardBadge_' + memberId);
  if (cBadge) {
    cBadge.className = 'attitude-badge ' + clsObj.badgeClass;
    cBadge.innerText = num + ' · ' + clsObj.level;
  }

  // Cập nhật viền card
  var card = document.getElementById('evalCard_' + memberId);
  if (card) {
    card.className = 'attitude-reason-card ' + clsObj.borderClass;
  }

  // Cập nhật trong bộ nhớ currentAttitudeData
  if (currentAttitudeData && currentAttitudeData[cat] && currentAttitudeData[cat].members) {
    var mObj = currentAttitudeData[cat].members.find(function(x) { return x.memberId === memberId; });
    if (mObj) {
      mObj.score = num;
      mObj.classification = clsObj.level;
      mObj.isCustom = true;
    }
  }

  // Tự động tính lại điểm tổng hợp (Overall) trong bộ nhớ cho thành viên này
  if (currentAttitudeData && currentAttitudeData.overall && currentAttitudeData.overall.members) {
    var ovObj = currentAttitudeData.overall.members.find(function(x) { return x.memberId === memberId; });
    var attObj = (currentAttitudeData.attitude && currentAttitudeData.attitude.members) ? currentAttitudeData.attitude.members.find(function(x) { return x.memberId === memberId; }) : null;
    var skillObj = (currentAttitudeData.skill && currentAttitudeData.skill.members) ? currentAttitudeData.skill.members.find(function(x) { return x.memberId === memberId; }) : null;
    var outObj = (currentAttitudeData.output && currentAttitudeData.output.members) ? currentAttitudeData.output.members.find(function(x) { return x.memberId === memberId; }) : null;

    if (ovObj && attObj && skillObj && outObj) {
      ovObj.attScore = attObj.score;
      ovObj.attClass = attObj.classification;
      ovObj.skillScore = skillObj.score;
      ovObj.skillClass = skillObj.classification;
      ovObj.outputScore = outObj.score;
      ovObj.outputClass = outObj.classification;
      ovObj.score = Math.round(attObj.score * 0.2 + skillObj.score * 0.5 + outObj.score * 0.3);
      ovObj.classification = getClientEvalClassObj(ovObj.score).level;
    }
  }

  markAttitudeChanged();
}

/**
 * Hàm tương thích với hàm cũ
 */
function onAttitudeScoreInputChange(memberId, val) {
  onEvalScoreInputChange('attitude', memberId, val);
}

/**
 * Đánh dấu có thay đổi để làm nổi bật nút Lưu
 */
function markAttitudeChanged() {
  var btnSave = document.getElementById('btnSaveAttitude');
  if (btnSave) {
    btnSave.style.boxShadow = '0 0 14px rgba(245, 158, 11, 0.7)';
    btnSave.innerHTML = '💾 Lưu Đánh Giá (Đã thay đổi*)';
  }
}

/**
 * Team Lead lưu đánh giá Năng Lực (Attitude, Skill, Output) vào hệ thống
 */
function saveAttitudeEvaluationClient() {
  if (!currentAttitudeData || !currentAttitudeData.periodKey) {
    showToast('Chưa có thông tin tuần để lưu!', 'error');
    return;
  }

  var evalPayload = {
    attitude: {},
    skill: {},
    output: {}
  };

  ['attitude', 'skill', 'output'].forEach(function(cat) {
    if (currentAttitudeData[cat] && currentAttitudeData[cat].members) {
      currentAttitudeData[cat].members.forEach(function(m) {
        evalPayload[cat][m.memberId] = {
          score: m.score,
          classification: m.classification,
          reason: m.reason || ''
        };
      });
    }
  });

  showLoading('Đang lưu đánh giá Năng Lực (Attitude - Skill - Output)...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast('Đã lưu đánh giá Năng Lực thành công!', 'success');
        loadAttitudeEvaluationData();
      } else {
        showToast(res ? res.message : 'Lỗi khi lưu đánh giá!', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Lỗi lưu đánh giá: ' + err.message, 'error');
    })
    .saveAttitudeEvaluation(currentAttitudeData.periodKey, evalPayload);
}

/**
 * Khôi phục lại đánh giá tự động tính từ Bảng Điểm Danh & KPI & Lỗi
 */
function resetAttitudeEvaluationClient() {
  if (!currentAttitudeData || !currentAttitudeData.periodKey) return;

  if (!confirm('Bạn có chắc chắn muốn xóa đánh giá tùy chỉnh và khôi phục lại tính điểm tự động từ Điểm Danh & KPI không?')) {
    return;
  }

  showLoading('Đang khôi phục đánh giá tự động từ Điểm Danh & KPI...');
  google.script.run
    .withSuccessHandler(function(res) {
      hideLoading();
      if (res && res.success) {
        showToast('Đã khôi phục đánh giá tự động thành công!', 'success');
        loadAttitudeEvaluationData();
      } else {
        showToast(res ? res.message : 'Lỗi khi khôi phục!', 'error');
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showToast('Lỗi khôi phục: ' + err.message, 'error');
    })
    .resetAttitudeEvaluation(currentAttitudeData.periodKey);
}
</script>
